# Reusable Tier-1: portable behavior suite — TS shards, nextest partitions,
# Postgres 18 service, nix-pinned Chromium, alpha-proof, mutation-differential.
# Builds release CLIs once and fans out the small artifact. Target p95 < 10 min.
# Called from pr-tiers.yml; required via the main-merge-queue ruleset.
name: reusable tier1

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  native:
    name: Tier 1 / native artifact
    runs-on: ubuntu-latest
    # Provisional cold-run budget (empty cargo/pnpm caches + release build).
    # Measure on shadow runs, then tighten toward p95 < 10 min / cold < 12.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-itotori
        with:
          native: "true"

      - name: Preflight native bins
        run: |
          set -euo pipefail
          # kaifuu-cli / utsushi-cli print usage and exit non-zero on no-arg /
          # --version (no clap --version). Existence + successful spawn is enough.
          for bin in target/release/kaifuu-cli target/release/utsushi-cli; do
            test -x "$bin"
            set +e
            "$bin" >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 126 ] || [ "$rc" -eq 127 ]; then
              echo "Tier-1 native preflight: $bin failed to exec (exit $rc)" >&2
              exit 1
            fi
            echo "Tier-1 native preflight: $bin runnable (exit $rc)"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ github.sha }}-linux-x64
          path: |
            target/release/kaifuu-cli
            target/release/utsushi-cli
          retention-days: 1
          if-no-files-found: error

  portable:
    name: Tier 1 / portable (${{ matrix.shard }})
    needs: [native]
    runs-on: ubuntu-latest
    # Provisional cold-run budget; measure on shadow runs, then tighten.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard:
          - ts-public-1of2
          - ts-public-2of2
          - rust-1of3
          - rust-2of3
          - rust-3of3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-itotori

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-${{ github.sha }}-linux-x64
          path: .ci/bin

      - name: Wire native bins into env
        run: |
          set -euo pipefail
          chmod +x .ci/bin/kaifuu-cli .ci/bin/utsushi-cli
          {
            echo "ITOTORI_KAIFUU_BIN=$PWD/.ci/bin/kaifuu-cli"
            echo "ITOTORI_UTSUSHI_BIN=$PWD/.ci/bin/utsushi-cli"
          } >> "$GITHUB_ENV"

      - name: Run portable shard
        run: just ci tier1-${{ matrix.shard }}

  db:
    name: Tier 1 / postgres
    runs-on: ubuntu-latest
    # Provisional cold-run budget (build graph + migrate + strict DB gates).
    # Measure on shadow runs, then tighten.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a # postgres:18
        env:
          POSTGRES_USER: itotori
          POSTGRES_PASSWORD: itotori
          POSTGRES_DB: itotori
        options: >-
          --health-cmd "pg_isready -U itotori -d itotori"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        ports:
          - "5432:5432"
    env:
      DATABASE_URL: postgres://itotori:itotori@127.0.0.1:5432/itotori
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-itotori

      - name: Preflight Postgres
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          # Service container is health-checked before steps; assert URL shape.
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "DATABASE_URL must be a postgres URL" >&2; exit 1 ;;
          esac
          echo "Tier-1 DB preflight ok: DATABASE_URL is set"

      - name: Run Tier-1 DB suite
        run: just ci tier1-db

  # The renderer comes from nix, NOT from Playwright's download. The DS visual
  # baselines are pixel-exact (maxDiffPixels=0) against the flake.lock-pinned
  # Chromium + font set, so a downloaded Chromium on a stock Ubuntu image can
  # only ever skip them — which is exactly what happened: the pixel assertions
  # never executed on a single PR while stale baselines sat red on main.
  # `nix develop .#browser` makes the baseline renderer and the CI renderer the
  # same derivations by construction; `just ci-tier1-browser` now FAILS rather
  # than skipping when that contract is unmet, so this cannot silently rot back.
  browser:
    name: Tier 1 / chromium
    runs-on: ubuntu-latest
    # Provisional cold-run budget (nix install + devShell realise + e2e + DS visual).
    # Measure on shadow runs, then tighten.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No `browser: "true"`: Playwright must not download a second, different
      # Chromium. The devShell below is the only renderer this lane may use.
      - uses: ./.github/actions/setup-itotori

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Fail before the suite if the renderer contract is not actually in place,
      # naming the binary AND the resolved faces — an unpinned font set changes
      # every baseline just as surely as a different browser build does.
      - name: Preflight nix Chromium + pinned fonts
        run: |
          set -euo pipefail
          nix develop .#browser --command bash -c '
            set -euo pipefail
            bin="${PLAYWRIGHT_CHROMIUM_BIN:-}"
            test -n "$bin"
            test -x "$bin"
            case "$bin" in /nix/store/*) ;; *) echo "renderer is not nix-store: $bin" >&2; exit 1 ;; esac
            case "${FONTCONFIG_FILE:-}" in /nix/store/*) ;; *) echo "fonts are not nix-pinned: ${FONTCONFIG_FILE:-}" >&2; exit 1 ;; esac
            "$bin" --version
            fc-match sans-serif
            fc-match monospace
            # The devShell deliberately ships only the renderer plus its
            # flake.lock-pinned just derivation; the JS toolchain is inherited
            # from setup-itotori and must survive `nix develop`.
            command -v pnpm >/dev/null
            just_bin="$(command -v just)"
            case "$just_bin" in /nix/store/*) ;; *) echo "just is not nix-pinned: $just_bin" >&2; exit 1 ;; esac
            "$just_bin" --version
            node --version
            echo "Tier-1 browser preflight ok: $bin"
          '

      - name: Run Tier-1 browser suite
        run: |
          nix develop .#browser --command bash -c '
            set -euo pipefail
            just_bin="$(command -v just)"
            case "$just_bin" in /nix/store/*) ;; *) echo "just is not nix-pinned: $just_bin" >&2; exit 1 ;; esac
            exec "$just_bin" ci tier1-browser
          '

  alpha:
    name: Tier 1 / alpha proof
    runs-on: ubuntu-latest
    # Provisional cold-run budget; measure on shadow runs, then tighten.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-itotori

      - name: Run alpha proof
        run: just test alpha

  mutation:
    name: Tier 1 / mutation differential
    runs-on: ubuntu-latest
    # Provisional cold-run budget (heavy recompile even with sccache miss).
    # Measure on shadow runs, then tighten.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-itotori
        with:
          sccache: "true"

      - name: Run mutation differential
        run: just ci tier1-mutation

  required:
    name: Tier 1 / required
    if: ${{ always() }}
    needs: [native, portable, db, browser, alpha, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate Tier-1 jobs
        run: |
          set -euo pipefail
          # All six dependency groups must succeed (portable matrix is one group).
          test '${{ join(needs.*.result, ',') }}' = 'success,success,success,success,success,success'
