name: Real-Bytes Private Proof (quarantined)

# The protected broker/evidence-agent path specified by docs/roadmap/real-bytes.md
# does not exist yet. Keep the old candidate-controlled, corpus-runner path
# unreachable: no pull-request trigger, private runner, candidate checkout,
# project-specific environment input, network-capable setup, or artifact upload.
# Manual requests fail closed until the external verifier installs that path.

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  unavailable:
    name: Private proof / unavailable
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject while the protected evidence agent is unavailable
        run: |
          echo 'external-private-evidence-agent-unavailable' >&2
          exit 1
