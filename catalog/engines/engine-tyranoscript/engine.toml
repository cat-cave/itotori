schema = "engine/v1"
id = "engine-tyranoscript"
plugin = "bin/kaifuu-cli"

[capabilities]
detection = "supported"
asset_inventory = "supported"
extraction = "not-claimed"
patching = "not-claimed"
key_profile = "not-claimed"
runtime_vm = "not-claimed"

[[check]]
id = "check-tyranoscript-public-capabilities"
lane = "lane-public"
covers = ["detection", "asset_inventory"]
executor = { kind = "engine-plugin", command = "test", selector = "readiness-profile" }

[[proof]]
id = "proof-tyranoscript-strict-capabilities"
lane = "lane-strict"
covers = ["detection", "asset_inventory"]
requires = { corpus_count = 0, tags = [] }
executor = { kind = "engine-plugin", command = "prove", selector = "synthetic-readiness" }
receipt = { outcome = "synthetic-readiness", minimum_executed = 1 }
