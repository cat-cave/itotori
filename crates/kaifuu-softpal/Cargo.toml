[package]
# @itotori-real-bytes-package
name = "kaifuu-softpal"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust Softpal / Amuse-Craft (\"Pal\" engine) reader: deterministic enumerate + extract of the `PAC ` archive (magic + u32 count @0x08 + 0x804 reserved header + 40-byte name/size/offset index), the inner TEXT.DAT string-pool codec (16-byte header + flag-gated keyless ROL+XOR decrypt/encrypt + 4-byte-index/cp932/NUL record parser with absolute byte offsets), and the SCRIPT.SRC dialogue+speaker+choice disassembler (Sv-version plaintext bytecode: TEXT-SHOW 32-byte + SELECT 16-byte commands, 4-byte TEXT.DAT pointers resolved to record boundaries, byte-locatable fields for patch-back). NOT the full Sv20 opcode table (replay node) or patch-back repack. No shell-outs."

[features]
real-bytes = []

[dependencies]
encoding_rs.workspace = true
serde = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
corpus-registry = { path = "../corpus-registry" }
sha2.workspace = true

[lints]
workspace = true

[[test]]
name = "textdat_real_corpus"
path = "tests/textdat_real_corpus.rs"
required-features = ["real-bytes"]

[[test]]
name = "pac_real_corpus"
path = "tests/pac_real_corpus.rs"
required-features = ["real-bytes"]

[[test]]
name = "opcode_real_corpus"
path = "tests/opcode_real_corpus.rs"
required-features = ["real-bytes"]

[[test]]
name = "script_real_corpus"
path = "tests/script_real_corpus.rs"
required-features = ["real-bytes"]

[[test]]
name = "patchback_real_corpus"
path = "tests/patchback_real_corpus.rs"
required-features = ["real-bytes"]

[[test]]
name = "pal_dll_loose_override_real"
path = "tests/pal_dll_loose_override_real.rs"
required-features = ["real-bytes"]
